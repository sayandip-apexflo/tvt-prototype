[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tvt-runtime"
version = "0.1.0"
description = "Single-box TVT K3s and Solution Pack runtime"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
tvt-k3s = "tvt_runtime.cli:main"

[tool.setuptools.packages.find]
include = ["apexfabric*", "tvt_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
