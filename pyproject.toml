[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tvt-runtime"
dynamic = ["version"]
description = "Single-box TVT K3s and Solution Pack runtime"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.8,<4.10",
  "cryptography>=44,<47",
  "fastapi>=0.115,<0.116",
  "jsonschema>=4.23,<5",
  "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<2.12",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn>=0.34,<0.35",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[project.scripts]
tvt-k3s = "tvt_runtime.cli:main"
tvt-edge = "tvt_edge.cli:main"
tvt-alert-dispatcher = "tvt_edge.alerting.cli:main"
tvt-k3s-watchdog = "tvt_edge.watchdog:main"
tvt-traffic-qualify = "tvt_edge.qualification:main"

[tool.setuptools.packages.find]
include = ["apexfabric*", "tvt_edge*", "tvt_runtime*"]

[tool.setuptools.package-data]
tvt_edge = ["static/index.html", "static/assets/*"]

[tool.setuptools.dynamic]
version = {attr = "tvt_edge.__version__"}

[tool.setuptools.data-files]
"share/tvt" = ["alembic.ini"]
"share/tvt/tvt_edge/db/migrations" = [
  "tvt_edge/db/migrations/env.py",
  "tvt_edge/db/migrations/script.py.mako",
]
"share/tvt/tvt_edge/db/migrations/versions" = ["tvt_edge/db/migrations/versions/*.py"]
"share/tvt/solution-packs/schema" = ["solution-packs/schema/*.json"]
"share/tvt/solution-packs/catalog/traffic-edge-runtime-2026.08.21-v4" = [
  "solution-packs/catalog/traffic-edge-runtime-2026.08.21-v4/*.json",
  "solution-packs/catalog/traffic-edge-runtime-2026.08.21-v4/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
