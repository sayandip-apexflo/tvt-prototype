<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ApexFabric · Camera operations</title><link rel="stylesheet" href="/dashboard/site.css"><style>
body{margin:0}.customer-header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw;background:var(--panel);border-bottom:1px solid var(--line)}.customer-header h1{font-size:22px;margin:0}.customer-header p{font-size:12px;color:var(--muted)}.customer-main{max-width:1400px;margin:auto;padding:30px 5vw}.customer-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.customer-cameras{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:20px 0 30px}.camera-tile{border:1px solid var(--line);border-radius:9px;padding:18px;background:var(--panel)}.camera-tile h3{margin:0 0 10px}.camera-tile p{font-size:12px;color:var(--muted)}.preview{background:#171720;border-radius:9px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.preview img{width:100%;height:100%;object-fit:contain}.customer-events{max-height:650px;overflow:auto;padding:0 20px!important}.customer-events article{padding:16px 0;border-bottom:1px solid var(--line)}.customer-events p,.customer-events small{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.customer-events img{width:100%;max-height:180px;object-fit:contain}.customer-events pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}.customer-note{font-size:12px;color:var(--muted)}select{padding:10px;width:100%;margin:0 0 14px}.customer-error{color:#a7394b;font-size:13px;min-height:20px}[hidden]{display:none!important}@media(max-width:850px){.customer-grid{grid-template-columns:1fr}.customer-header{align-items:flex-start;gap:12px}}
dialog{border:1px solid var(--line);border-radius:12px;max-width:640px;width:90%;max-height:80vh;overflow:auto}dialog::backdrop{background:#0006}#alert-history article,#alert-rules article,#alert-popup-items article{padding:12px 0;border-bottom:1px solid var(--line)}#alert-rule-form label{display:flex;flex-direction:column;gap:6px}#alert-rule-form input{padding:10px;min-width:0}#alert-rule-form p{grid-column:1/-1}#alerts-error{color:#a7394b}</style></head><body data-theme="light"><header class="customer-header"><div><h1>ApexFabric <span style="font-weight:400">/ Camera operations</span></h1><p id="site">Connecting to your site…</p></div><button id="refresh">Refresh</button></header><main class="customer-main"><p id="error" class="customer-error" role="status"></p><h2>Cameras & solutions</h2><section id="cameras" class="customer-cameras"><p>Loading camera assignments…</p></section><div class="customer-grid"><section><h2>Camera preview</h2><select id="camera-select" aria-label="Select camera"><option value="">Select a camera</option></select><div class="preview"><img id="preview" alt="Latest camera frame" hidden><span id="preview-empty" style="color:#b6aec5">Select a camera to view its latest frame.</span></div><p id="frame-status" class="customer-note">Refreshed snapshots · continuous video is not available yet.</p></section><section><h2>Emitted events</h2><div id="events" class="page-card customer-events"><p>Loading events…</p></div></section></div></main><script src="/dashboard/alerts.js"></script><script src="/dashboard/customer.js"></script></body></html>
