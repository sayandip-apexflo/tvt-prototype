apiVersion: v1
kind: Namespace
metadata:
  name: apexfabric
  labels:
    app.kubernetes.io/part-of: apexfabric
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-agent
  namespace: apexfabric
  labels:
    app.kubernetes.io/name: node-agent
    app.kubernetes.io/part-of: apexfabric
automountServiceAccountToken: false
---
# A controller-populated, long-lived token is used only by the host sync
# worker. Its generated value is copied into a root-owned kubeconfig and is
# never committed to this manifest.
apiVersion: v1
kind: Secret
metadata:
  name: node-agent-host-token
  namespace: apexfabric
  annotations:
    kubernetes.io/service-account.name: node-agent
type: kubernetes.io/service-account-token
---
# Namespace-scoped reconciliation permissions. Namespace creation remains an
# installer/control-plane responsibility and does not require a broad ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-agent-reconciler
  namespace: apexfabric
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "pods", "secrets", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events", "pods/proxy"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-agent-reconciler
  namespace: apexfabric
subjects:
  - kind: ServiceAccount
    name: node-agent
    namespace: apexfabric
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-agent-reconciler
---
# The unchanged renderer includes the pre-created Namespace in each
# server-side Apply. Restrict that patch permission to this one Namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apexfabric-node-agent-namespace
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["apexfabric"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apexfabric-node-agent-namespace
subjects:
  - kind: ServiceAccount
    name: node-agent
    namespace: apexfabric
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apexfabric-node-agent-namespace
---
# Read-only Node status is required by the host health API. Workload reads stay
# namespace-scoped in node-agent-reconciler; this grants no Node mutation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apexfabric-node-agent-status
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apexfabric.com"]
    resources: ["apexnodestatuses"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apexfabric-node-agent-status
subjects:
  - kind: ServiceAccount
    name: node-agent
    namespace: apexfabric
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apexfabric-node-agent-status
