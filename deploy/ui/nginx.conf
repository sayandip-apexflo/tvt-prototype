worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    server {
        listen 18081;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store' always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 960s;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /apexfabricdashboard { try_files /index.html =404; }
        location = /apexfabricdashboard/ { try_files /index.html =404; }
        location = /apexfabricdashboard/site.js { try_files /site.js =404; }
        location = /apexfabricdashboard/site.css { try_files /site.css =404; }
        location = /dashboard { try_files /customer.html =404; }
        location = /dashboard/ { try_files /customer.html =404; }
        location = /dashboard/customer.js { try_files /customer.js =404; }
        location = /dashboard/site.css { try_files /site.css =404; }
        location = /dashboard/alerts.js { try_files /alerts.js =404; }
        location ~ "^/dashboard/api/(alert-rules|alerts|alerts/acknowledge)$" {
            limit_except GET POST { deny all; }
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location ~ "^/dashboard/api/(customer|cameras/snapshot|telemetry/events|telemetry/snapshots/[a-f0-9]{64})$" {
            limit_except GET { deny all; }
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location ~ "^/apexfabricdashboard/api/(alert-rules|alerts|alerts/acknowledge|status|catalog|catalog/refresh|cameras|cameras/snapshot|device-registry|bundles/generate|bundles/preview|deploy|runtime-configuration|workload-action|workload-telemetry|workload-events|telemetry/events|telemetry/storage|telemetry/snapshots/[a-f0-9]{64}|jobs/[a-f0-9]+)$" {
            rewrite ^/apexfabricdashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location / { return 404; }
    }
}
