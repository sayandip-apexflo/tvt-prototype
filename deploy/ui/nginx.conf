worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    server {
        listen 18081;
        server_name _;
        absolute_redirect off;
        root /usr/share/nginx/html;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control 'no-store' always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 960s;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /apexfabricdashboard { return 308 /apexfabricdashboard/; }
        location = /apexfabricdashboard/ {
            auth_basic "ApexFabric administration";
            auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
            try_files /index.html =404;
        }
        location ^~ /apexfabricdashboard/assets/ {
            auth_basic "ApexFabric administration";
            auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
            rewrite ^/apexfabricdashboard/(.*)$ /$1 last;
        }
        location ^~ /assets/ { try_files $uri =404; }
        location = /dashboard { return 308 /dashboard/; }
        location = /dashboard/ { try_files /index.html =404; }
        location ^~ /dashboard/assets/ { rewrite ^/dashboard/(.*)$ /$1 last; }
        location ~ "^/dashboard/(customer|alerts\.js|customer\.js|reports\.js|site\.css)$" {
            limit_except GET { deny all; }
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location ~ "^/dashboard/api/(alert-templates|alert-rules|alerts|alerts/acknowledge|site|persons/rename)$" {
            limit_except GET POST { deny all; }
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location ~ "^/dashboard/api/(customer|cameras/snapshot|telemetry/events|telemetry/snapshots/[a-f0-9]{64}|reports/attendance|reports/vehicle-traffic|persons)$" {
            limit_except GET { deny all; }
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location ~ "^/apexfabricdashboard/api/(alert-templates|alert-rules|alerts|alerts/acknowledge|status|catalog|catalog/refresh|cameras|cameras/snapshot|device-registry|bundles/generate|bundles/preview|deploy|runtime-configuration|workload-action|workload-telemetry|workload-events|telemetry/events|telemetry/storage|telemetry/snapshots/[a-f0-9]{64}|jobs/[a-f0-9]+|reports/attendance|reports/vehicle-traffic|persons|persons/rename)$" {
            auth_basic "ApexFabric administration";
            auth_basic_user_file /etc/nginx/auth/admin.htpasswd;
            rewrite ^/apexfabricdashboard/(.*)$ /$1 break;
            proxy_pass http://127.0.0.1:8088;
        }
        location / { return 404; }
    }
}
