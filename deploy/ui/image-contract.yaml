contractVersion: apexfabric-ui/v1
name: apexfabric-ui
version: alerts-v2
architectures: [amd64]
image: apexfabric/ui:alerts-v2
role: site-presentation-and-api-proxy
listenPort: 18081
health:
  liveness: /healthz
  readiness: /healthz
  note: Checks the UI process; installer separately verifies backend and registry.
pages:
  management: /apexfabricdashboard
  customer: /dashboard
backend:
  origin: http://127.0.0.1:8088
  tvtEdgeOrigin: http://127.0.0.1:8089
  hostNetworkRequired: true
  managementPrefix: /apexfabricdashboard/api
  customerPrefix: /dashboard/api
  customerMethods: [GET, POST]
  customerWrites: [alert-rules, alerts/acknowledge]
  customerResources: [alert-templates, customer, cameras/snapshot, telemetry/events, telemetry/snapshots, alert-rules, alerts]
  # All of /dashboard/api/v1/* proxies to tvtEdgeOrigin (GET/POST/PUT/PATCH/DELETE) --
  # tvt_edge's own JSON API (cameras CRUD/credentials/stream/geometry, deployments,
  # enrollment, alerts, cluster, audit, reports). /metrics and /internal/v1/* are never
  # reachable through this proxy. See deploy/ui/nginx.conf and AGENTS.md's TVT frontend
  # policy for the full route surface.
  customerV1Methods: [GET, POST, PUT, PATCH, DELETE]
storage:
  persistent: false
  writablePaths: [/tmp, /var/cache/nginx]
process:
  uid: 101
  gid: 101
  readOnlyRootFilesystem: true
  kubernetesCredentialsRequired: false
features:
  management: [camera-inventory, catalog-selection, deployment, start-stop, health, configuration, events, snapshots]
  customer: [camera-assignments, deployment-status, refreshed-camera-snapshots, emitted-events, numeric-threshold-rules, event-rules, plate-matching, alert-popups, alert-acknowledgement, face-enrollment, camera-inventory-management, camera-credentials, camera-stream-configuration, camera-zones-and-lines]
limitations:
  - No continuous browser video transport.
  - Alert rules match detections, plates and individual numeric event values; no time-window aggregation or external actions.
  - No per-user authentication or authorization; routes are not a security boundary between users.
  - Runtime image contracts and event/configuration schema hardening are separate work.
