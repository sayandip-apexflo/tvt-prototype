<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#7553cf"/><script>
try {
  const saved = localStorage.getItem('apexfabric-theme');
  document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
    ? saved : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
} catch {
  document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
</script><title>ApexFabric · Edge Operations</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
