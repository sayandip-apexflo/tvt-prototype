apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexfabric-ui
  namespace: apexfabric
  labels: {app.kubernetes.io/name: apexfabric-ui, app.kubernetes.io/part-of: apexfabric}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: apexfabric-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: apexfabric-ui}
    spec:
      # Existing control service remains bound to host loopback on port 8088.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector: {apexfabric.com/control-plane: 'true'}
      securityContext: {runAsUser: 101, runAsGroup: 101, fsGroup: 101, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ui
          image: __APEXFABRIC_REGISTRY__/apexfabric/ui:alerts-v2
          imagePullPolicy: Always
          command: [nginx, '-g', 'daemon off;']
          ports: [{name: http, containerPort: 18081}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 15}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: admin-auth, mountPath: /etc/nginx/auth, readOnly: true}
      volumes:
        - {name: temp, emptyDir: {sizeLimit: 64Mi}}
        - {name: nginx-cache, emptyDir: {sizeLimit: 64Mi}}
        - {name: admin-auth, secret: {secretName: apexfabric-ui-admin-auth}}
---
apiVersion: v1
kind: Service
metadata: {name: apexfabric-ui, namespace: apexfabric}
spec:
  selector: {app.kubernetes.io/name: apexfabric-ui}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: apexfabric-ui, namespace: apexfabric}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /apexfabricdashboard
            pathType: Prefix
            backend: {service: {name: apexfabric-ui, port: {name: http}}}
          - path: /dashboard
            pathType: Prefix
            backend: {service: {name: apexfabric-ui, port: {name: http}}}
