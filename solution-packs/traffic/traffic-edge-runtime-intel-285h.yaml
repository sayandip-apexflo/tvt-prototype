api_version: apexfabric.com/v1alpha1
kind: DeploymentBundle
deployment_id: traffic-edge-intel-285h
solution:
  solution_id: traffic-edge
  version: 2026.8.20
applications:
  - name: runtime
    image:
      repository: __APEXFABRIC_REGISTRY__/apexfabric/traffic-edge-runtime
      tag: intel-285h-2026.08.20-v2
      pull_policy: IfNotPresent
    replicas: 1
    lifecycle:
      desired_state: Running
      termination_grace_period_seconds: 60
    resources:
      cpu: {request: "8", limit: "16"}
      memory: {request: "16Gi", limit: "32Gi"}
      accelerators: {decoder: 0, metis: 0}
      camera_streams: 2
    cameras: [cam4, cam5]
    camera_contract:
      configuration_owner: platform
      transport: rtsp
      required_for_readiness: false
      scheduling_mode: runtime-connectivity
    configuration:
      desired_state_secret: traffic-edge-intel-285h-desired-state
      desired_state_key: desired_state.json
      models_delivery: baked-in
      models_root: /models/traffic/openvino
      inference_mode: cpu-compatible
    placement:
      runtime_profile: intel-285h-gpu-npu
      node_class: cv
      architecture: amd64
      requires_qualified_node: true
      requires_camera_labels: false
      characteristics:
        hardware-profile: intel-285h
    external_mounts:
      - name: cam4-source
        mount_path: /run/secrets/apexfabric/cam4.rtsp
        read_only: true
        source:
          type: secret
          name: traffic-edge-intel-285h-camera-sources
          key: cam4.rtsp
      - name: cam5-source
        mount_path: /run/secrets/apexfabric/cam5.rtsp
        read_only: true
        source:
          type: secret
          name: traffic-edge-intel-285h-camera-sources
          key: cam5.rtsp
    plan_compiler:
      type: edge-agent-v1
      desired_state_secret: traffic-edge-intel-285h-desired-state
      desired_state_key: desired_state.json
    health:
      startup: {path: /readyz, port: management, period_seconds: 5, timeout_seconds: 4, failure_threshold: 60}
      readiness: {path: /readyz, port: management, period_seconds: 10, timeout_seconds: 4, failure_threshold: 3}
      liveness: {path: /healthz, port: management, initial_delay_seconds: 30, period_seconds: 15, timeout_seconds: 4, failure_threshold: 4}
    ports:
      - {name: management, container_port: 8080, protocol: TCP}
    telemetry:
      metrics: {path: /metrics, port: management, format: json}
      events: {path: /events, port: management, protocol: sse}
    environment:
      SOLUTION_PACK: traffic
      VEHICLE_DEVICE: CPU
      PLATE_DEVICE: CPU
      OCR_DEVICE: CPU
configuration:
  edge_id: intel-box-01
  deployment_mode: two-camera-demo
  runtime_plan_is_compiled_by_init_container: true
  image_contract: apexfabric-v1
  secret_input_contract: traffic-runtime-v1
  models_delivery: baked-in
  inference_mode: cpu-compatible
