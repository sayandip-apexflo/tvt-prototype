name: surveillance-edge-runtime
version: 2026.08.24-v3
contractVersion: v1
ui:
  displayName: Surveillance analytics
  description: Identity, intrusion, and occupancy analytics for camera deployments.
  camera:
    defaultFps: 8
    defaultApp: reid
    apps:
      reid:
        label: Person re-identification
        symbol: RE
      face_recognition:
        label: Face recognition
        symbol: FR
        geometry:
          kind: zone
          label: Face match/attendance zone
          configPath: zones.face_recognition
          required: false
          nameTemplate: "{app}_zone"
      face_enrollment:
        label: Face enrollment kiosk
        symbol: FE
      intrusion:
        label: Intrusion detection
        symbol: IN
        geometry:
          kind: zone
          label: Intrusion detection region
          configPath: zones.intrusion
          required: false
          nameTemplate: "{app}_zone"
      people_counting:
        label: People counting
        symbol: PC
        geometry:
          kind: line
          label: People counting line
          configPath: lines.people_counting
          required: false
          nameTemplate: "{app}_line"
          values:
            in_side: right
  deployment:
    storageGi: 20
    cpuRequest: 8
    cpuLimit: 16
    memoryRequestGi: 16
    memoryLimitGi: 32
    pullPolicy: IfNotPresent
    inferenceMode: cpu-compatible
contractExtensions:
  persistentSurveillanceState:
    required: true
    mountPath: /state
    reason: ReID rejoin state, history, and event evidence
architectures: [amd64]
hardwareProfile: intel-285h
runtimeBase:
  image: apexfabric-intel-surveillance-runtime-base:intel-285h-2026.08.24-v1
  digest: sha256:ff3bc61535f4b4289298db44915ba18e2412c2bfa2c66065597dd1af3ea96f5d
  deployment: build-parent-only
models:
  delivery: baked-in
  root: /models/surveillance
  metadata: /opt/pipeline/edge_runtime/model_registry/models.yaml
configuration:
  desiredStatePath: /configs/desired_state.json
  hotReload:
    enabled: true
    pollSeconds: 2
    strategy: transactional-child-restart
    revisionPolicy: nondecreasing
    mountPath: /configs
    kubernetesSubPathSupported: false
secrets:
  root: /run/secrets/apexfabric
  referenceFormat: file:/run/secrets/apexfabric/<camera-id>.rtsp
runtimePlan:
  compiler: python -m edge_runtime.agent.edge_agent
  output: /plans/surveillance.runtime_plan.json
network:
  port: 8080
  hostNetworkRequired: false
endpoints:
  health: /healthz
  readiness: /readyz
  metrics: /metrics
  events: /events
  snapshots: /snapshots/<state-relative-path>
metricsFormat: application/json
eventProtocol: sse
eventSchema: analytics-event.schema.json
# No faceGallery/faceEnrollment/faceGroup HTTP routes: biometric writes never cross the
# unauthenticated pod-proxy surface. The edge holds no face gallery at all — it only
# extracts and emits normalized embeddings as events on the existing /events stream
# (application: face_recognition, event_type: face_detection_event; application:
# face_enrollment, event_type: enrollment_capture_event). Matching those embeddings
# against known people and auto-enrolling new ones both happen centrally, over the
# control plane's own vector DB — see analytics-event.schema.json and
# docs/contracts/tvt-identity-v1/CV-PIPELINE-HANDOFF.md.
process:
  uid: 10001
  gid: 10001
  readOnlyRootSupported: true
resources:
  cpuRequest: "8"
  memoryRequest: 16Gi
  maxCameraStreams: 16
accelerators:
  - intel-igpu
  - intel-npu
devices:
  - /dev/dri
  - /dev/accel
storage:
  persistentVolumes:
    - mountPath: /state
      purpose: event, gallery, history, crop, and snapshot storage
  temporaryPaths: [/plans, /tmp/apexfabric]
externalDependencies: []
